<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>课件父容器 — 协议调试</title>
  <link rel="stylesheet" href="parent-shell.css">
</head>
<body>
  <div class="toolbar">
    <button type="button" class="btn" id="btnSidebar" title="折叠/展开左侧课纲">课纲</button>
    <button type="button" class="btn btn-primary" id="btnNext">下一步</button>
    <span class="step-stat" id="stepStat">—</span>
    <button type="button" class="btn btn-danger" id="btnReset">清空课件</button>
    <button type="button" class="btn" id="btnHelp">help</button>
    <button type="button" class="btn" id="btnReload">重载 iframe</button>
    <span class="stat" id="stat">加载中…</span>
  </div>

  <div class="main">
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-head" id="sidebarHead">课纲 — 等待 help</div>
      <div class="action-list" id="actionList">
        <div class="empty-hint">等待 iframe ready…</div>
      </div>
    </aside>
    <div class="sidebar-resizer" id="sidebarResizer" title="拖拽调整课纲宽度"></div>
    <div class="stage">
      <iframe id="course" title="课件"></iframe>
    </div>
  </div>

  <div class="log-resizer" id="logResizer" title="拖拽调整日志高度" hidden></div>
  <div class="log-wrap collapsed" id="logWrap">
    <div class="log-head">
      <span>回包日志</span>
      <button type="button" id="btnCopyLog">复制</button>
      <button type="button" id="btnClearLog">清空</button>
      <button type="button" id="btnToggleLog">展开</button>
    </div>
    <div id="log"></div>
  </div>

  <script src="parent-shell.js"></script>
</body>
</html>
